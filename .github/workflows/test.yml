
name: DBLP XML Scraper

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run DBLP scraper
        run: xvfb-run -a node dblp_scrapper.js

      - name: Verify XML files exist
        run: |
          set -eu
          test -n "$(find dblp-data -maxdepth 1 -type f -name '*.xml' -print -quit)"
          ls -lh dblp-data/*.xml

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload XML files for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dblp-data

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
