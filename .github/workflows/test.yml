
name: DBLP XML Scraper

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Playwright Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run DBLP scraper
        run: xvfb-run -a node dblp_scrapper.js

      - name: Upload retrieved XML files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dblp-xml-${{ github.run_number }}
          path: dblp-data/*.xml
          if-no-files-found: warn
          retention-days: 14
