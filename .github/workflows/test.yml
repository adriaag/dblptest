
name: DBLP XML Scraper

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run DBLP scraper
        run: xvfb-run -a node dblp_scrapper.js

      - name: Verify XML files exist
        run: |
          set -eu
          test -n "$(find dblp-data -maxdepth 1 -type f -name '*.xml' -print -quit)"
          ls -lh dblp-data/*.xml
      
      - name: Prepare GitHub Pages site
        run: |
          mkdir -p site
          cp dblp-data/*.xml site/

          # Generate a homepage listing the XML files.
          {
            echo '<!doctype html>'
            echo '<html lang="en">'
            echo '<head><meta charset="utf-8"><title>DBLP XML files</title></head>'
            echo '<body><h1>DBLP XML files</h1><ul>'

            for file in site/*.xml; do
              [ -f "$file" ] || continue
              name=$(basename "$file")
              printf '<li><a href="%s">%s</a></li>\n' "$name" "$name"
            done

            echo '</ul></body></html>'
          } > site/index.html

          echo "Files prepared for publication:"
          find site -maxdepth 1 -type f -print

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

